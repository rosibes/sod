name: Frontend CI
on:
  pull_request:
    paths: 
      - 'frontend/**'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  frontend:
    runs-on:  ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
      
      - name: Build Frontend
        working-directory: frontend
        run: npm run build 
        
